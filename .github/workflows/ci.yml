name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt pytest httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-ml.txt
      - name: Fast tests (no network, no ArangoDB, no large models)
        working-directory: backend
        run: pytest -m "not slow and not network and not arango" -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, type-check, test, build
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm test
          npm run build

  docker-build:
    # Verifies both images build (same files docker-compose uses). Nothing is published; no registry credentials are used.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: elysium-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: elysium-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
            VITE_API_KEY=ci
