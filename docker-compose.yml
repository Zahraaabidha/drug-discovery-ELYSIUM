version: "3.9"

services:
  arangodb:
    image: arangodb:3.11
    container_name: elysium_arangodb
    environment:
      ARANGO_ROOT_PASSWORD: changeme
    ports:
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8529/_api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: elysium_backend
    depends_on:
      - arangodb
    ports:
      - "8000:8000"
    environment:
      ARANGO_HOST: arangodb
      ARANGO_PORT: 8529
      ARANGO_USER: root
      ARANGO_PASSWORD: changeme
    volumes:
      - model_cache:/root/.cache

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: elysium_frontend
    depends_on:
      - backend
    ports:
      - "5174:5174"

volumes:
  arango_data:
  model_cache:
