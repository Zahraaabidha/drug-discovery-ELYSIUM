services:
  arangodb:
    image: arangodb:3.11
    container_name: elysium_arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-changeme}
    ports:
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8529/_api/version 2>&1 | grep -q HTTP/"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: elysium_backend
    depends_on:
      arangodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # override the localhost values from backend/.env for the container network
      ARANGO_HOST: arangodb
      ARANGO_PORT: "8529"
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-changeme}
      DATABASE_URL: sqlite:////data/elysium.db
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    volumes:
      - ./backend/save_folder:/app/save_folder
      # use the project's existing SQLite database (31 legacy runs + registry) instead of an empty volume
      - ./backend/elysium.db:/data/elysium.db
      - model_cache:/app/.hf_cache
      - index_data:/app/index_data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_API_KEY: ${API_KEY:-changeme}
    container_name: elysium_frontend
    depends_on:
      - backend
    ports:
      - "5174:5174"

volumes:
  arango_data:
  model_cache:
  index_data:
